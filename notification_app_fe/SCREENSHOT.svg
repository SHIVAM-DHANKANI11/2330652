<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a237e" />
      <stop offset="100%" stop-color="#283593" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa" />
      <stop offset="100%" stop-color="#e8eaf6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="24" ry="24" fill="url(#bg)" />
  <rect x="60" y="60" width="1080" height="120" rx="20" ry="20" fill="#ffffff" opacity="0.95" />
  <text x="90" y="110" font-family="Arial, sans-serif" font-size="36" fill="#1a237e" font-weight="700">Campus Notifications System</text>
  <text x="90" y="150" font-family="Arial, sans-serif" font-size="18" fill="#333333">Dashboard | All Notifications | Priority Inbox</text>
  <g>
    <rect x="90" y="220" width="320" height="180" rx="20" ry="20" fill="url(#card)" />
